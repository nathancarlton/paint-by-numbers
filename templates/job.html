{% extends "base.html" %}
{% block body %}
<div id="wait" class="card center" {% if job.status != 'processing' %}style="display:none"{% endif %}>
  <div class="spinner"></div>
  <div>Mixing {{ job.colors }} colours…</div>
  <p class="muted">Finding paintable regions and numbering them.</p>
</div>
<div id="err" class="card" style="display:none">
  <h3>Something went wrong</h3>
  <p id="errmsg" class="muted"></p>
  <a class="btn secondary" href="/">Try another photo</a>
</div>
<div id="done" style="display:none">
  <div class="card">
    <a id="bigprev" href="" target="_blank"><img id="prev" class="preview" alt="Paint by numbers outline"></a>
    <p class="muted center" style="margin:10px 0 0"><span id="stats"></span> · tap to zoom</p>
  </div>
  <div class="card">
    <button id="print" class="btn">🖨️ Print it (2 pages)</button>
    <p id="pmsg" class="muted center" style="margin:10px 0 0"></p>
  </div>
  <div class="card"><h3 id="swh">Your colours</h3><div id="sw" class="swatches"></div></div>
  <div class="card"><h3>Finished reference</h3><img id="col" class="preview" alt="Colour reference"></div>
  <div class="row">
    <a class="btn secondary" id="pdf" href="" target="_blank">Download PDF</a>
    <a class="btn secondary" href="/">New photo</a>
  </div>
</div>
<script>
const id = {{ job.id|tojson }}, noPrint = {{ no_print|tojson }};
const $ = (s) => document.getElementById(s);
function show(job) {
  $('wait').style.display = 'none';
  if (job.status === 'error') { $('errmsg').textContent = job.error || 'unknown error'; $('err').style.display = 'block'; return; }
  const base = '/jobs/' + id + '/';
  $('prev').src = base + 'preview.png'; $('bigprev').href = base + 'numbered.png';
  $('col').src = base + 'colored.png'; $('pdf').href = base + 'pbn.pdf';
  $('stats').textContent = job.n_colors + ' colours · ' + job.regions + ' numbers';
  $('sw').innerHTML = '';
  if (job.names) $('swh').textContent = 'Paint pots to use';
  (job.palette || []).forEach((hex, i) => {
    const d = document.createElement('div'); d.className = 'sw'; d.style.background = hex;
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    d.style.color = (0.299*r + 0.587*g + 0.114*b) > 140 ? '#000' : '#fff';
    d.textContent = job.labels ? job.labels[i] : i + 1;
    if (job.names) d.title = 'Pot ' + job.labels[i] + ' - ' + job.names[i];
    $('sw').appendChild(d);
  });
  if (noPrint) { $('print').disabled = true; $('pmsg').textContent = 'Printing is turned off on this server — download the PDF instead.'; }
  $('done').style.display = 'block';
}
async function poll() {
  try {
    const r = await fetch('/api/jobs/' + id, { cache: 'no-store' });
    const job = await r.json();
    if (job.status === 'processing') { setTimeout(poll, 1500); return; }
    show(job);
  } catch (e) { setTimeout(poll, 3000); }
}
$('print').addEventListener('click', async () => {
  const btn = $('print'); btn.disabled = true; $('pmsg').textContent = 'Sending to the printer…';
  try {
    const r = await fetch('/api/jobs/' + id + '/print', { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    $('pmsg').textContent = '✅ Sent to ' + j.printer + '. Go grab your pages!';
    setTimeout(() => { btn.disabled = false; btn.textContent = '🖨️ Print another copy'; }, 8000);
  } catch (e) { $('pmsg').textContent = '❌ ' + e.message; btn.disabled = false; }
});
poll();
</script>
{% endblock %}
